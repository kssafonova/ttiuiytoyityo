name: Import OKNOVA source

on:
  push:
    branches: [main]
    paths:
      - oknova-source.tar.gz.b64.part6

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack site source
        run: |
          cat oknova-source.tar.gz.b64.part* > /tmp/oknova-source.tar.gz.b64
          base64 -d /tmp/oknova-source.tar.gz.b64 > /tmp/oknova-source.tar.gz
          tar -xzf /tmp/oknova-source.tar.gz -C .

      - name: Reuse lightweight preview assets
        run: |
          mkdir -p public/assets
          cp assets/previews/hs_portal_preview.svg public/assets/hs_portal_preview.svg
          cp assets/previews/panoramic_window_preview.svg public/assets/panoramic_window_preview.svg
          cp assets/previews/ordinary_window_preview.svg public/assets/ordinary_window_preview.svg
          cp assets/previews/balcony_block_preview.svg public/assets/balcony_block_preview.svg

      - name: Commit imported project
        run: |
          rm -f oknova-source.tar.gz.b64.part*
          rm -f .github/workflows/import-oknova.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add OKNOVA React site and fix responsive header"
          git push
